<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SyncDay - 설정</title>
    <link rel="stylesheet" href="../CSS/common.css">
    <link rel="stylesheet" href="../CSS/pages.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /*팝업(모달) 전용 CSS 디자인 (HTML과 밀접하여 상단 유지)*/
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative;
            transform: translateY(20px); transition: transform 0.2s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-close {
            position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #aaa;
            cursor: pointer; border: none; background: none;
        }
        .modal-title { font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 15px; padding-right: 20px; line-height: 1.4;}
        .modal-date { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
        .modal-body { font-size: 0.95rem; color: #334155; line-height: 1.6; white-space: pre-wrap; }
        
        .inquiry-textarea {
            width: 100%; height: 120px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px;
            resize: none; outline: none; margin-bottom: 15px; font-family: inherit; font-size: 0.95rem;
            box-sizing: border-box;
        }
        .inquiry-textarea:focus { border-color: #4361ee; }
        .inquiry-list { margin-top: 18px; }
        .inquiry-list-title { font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 8px; }
        .inquiry-list-title small { font-weight: 500; color: #94a3b8; margin-left: 6px; }
        .inquiry-item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; background: #fff; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
        .inquiry-item:hover, .inquiry-item:focus-visible { border-color: #4361ee; box-shadow: 0 2px 8px rgba(67,97,238,.08); outline: none; }
        .inquiry-item .inquiry-q, .inquiry-item .inquiry-answer { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .detail-label { font-size: 13px; font-weight: 700; color: #64748b; margin-bottom: 6px; }
        .detail-label.answer { color: #4361ee; }
        .detail-text { font-size: 15px; color: #334155; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; background: #f8fafc; border-radius: 8px; padding: 12px 14px; max-height: 40vh; overflow-y: auto; }
        .detail-wait { font-size: 14px; color: #94a3b8; background: #f8fafc; border-radius: 8px; padding: 12px 14px; }
        .inquiry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .inquiry-status { font-size: 12px; font-weight: 700; color: #64748b; background: #f1f5f9; border-radius: 6px; padding: 2px 8px; }
        .inquiry-status.done { color: #047857; background: #ecfdf5; }
        .inquiry-date { font-size: 12px; color: #94a3b8; }
        .inquiry-q { font-size: 14px; color: #334155; white-space: pre-wrap; overflow-wrap: anywhere; }
        .inquiry-answer { margin-top: 8px; padding: 10px 12px; background: #f8fafc; border-radius: 8px; font-size: 14px; color: #334155; white-space: pre-wrap; overflow-wrap: anywhere; }
        .inquiry-answer b { color: #4361ee; margin-right: 4px; }
        .notice-item { cursor: pointer; transition: background 0.2s; }
        .notice-item:hover { background: #eef2ff; }
        .notice-item .notice-date { float: right; font-size: 12px; color: #94a3b8; font-weight: 400; margin-left: 8px; }
        .notice-item .notice-pin { color: #4361ee; margin-right: 4px; }
        .notice-empty { font-size: 14px; color: #94a3b8; margin: 4px 0; }
    </style>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#4361ee">
</head>
<body class="app-layout">
    <header id="header"><h1 class="header-logo">SyncDay</h1><button class="header-logout" onclick="logout()">로그아웃</button></header>
    <div id="main-container">
        <nav id="sidebar-left">
            <h3>메뉴</h3>
            <a href="main.html" class="menu-item">홈</a>
            <a href="schedule.html" class="menu-item">캘린더</a>
            <a href="todo.html" class="menu-item">투두</a>
            <a href="habit.html" class="menu-item">루틴</a>
            <a href="settings.html" class="menu-item active">설정</a>
            <div class="sidebar-profile">
                <div id="user-email-display" class="user-email">로딩중...</div>
                <button onclick="logout()" class="logout-btn">로그아웃</button>
            </div>
        </nav>
        
        <main id="main-content">
            <div class="dashboard-widget">
                <h2 style="margin-bottom: 30px;">환경 설정</h2>

                <div class="settings-section">
                    <h3 class="settings-title">회원 정보 및 닉네임 설정</h3>
                    <p id="user-info-text" style="margin-bottom: 12px; color: #64748b; font-size: 14px;">로그인된 계정: 불러오는 중...</p>
                    
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="nickname-input" class="settings-input" placeholder="원하는 닉네임을 입력해 주세요">
                        <button onclick="saveNickname()" class="btn-primary">저장하기</button>
                    </div>
                    <p id="nickname-status" style="color: #10b981; font-size: 13px; margin-top: 8px; display: none;">닉네임을 바꿨어요!</p>
                </div>

                <div class="settings-section">
                    <h3 class="settings-title">공지사항</h3>
                    <div id="notice-list"><p class="notice-empty">불러오는 중...</p></div>
                </div>

                <div class="settings-section">
                    <h3 class="settings-title">고객 센터 및 문의하기</h3>
                    <p style="font-size: 14px; color: #64748b; margin-bottom: 12px;">서비스 이용 중 불편한 점이나 추가되었으면 하는 기능이 있으시면 언제든 알려 주세요.</p>
                    <button onclick="openInquiryModal()" class="btn-primary">1:1 문의글 작성하기</button>
                    <div id="inquiry-list" class="inquiry-list"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="notice-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('notice-modal')">&times;</button>
            <div id="notice-modal-title" class="modal-title">공지사항 제목</div>
            <div id="notice-modal-date" class="modal-date">날짜</div>
            <div id="notice-modal-body" class="modal-body">내용</div>
        </div>
    </div>

    <div id="inquiry-detail-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('inquiry-detail-modal')">&times;</button>
            <div class="modal-title">1:1 문의</div>
            <div id="inquiry-detail-meta" class="inquiry-head" style="margin-bottom: 14px;"></div>
            <div class="detail-label">문의 내용</div>
            <div id="inquiry-detail-q" class="detail-text"></div>
            <div id="inquiry-detail-a" style="margin-top: 18px;"></div>
        </div>
    </div>

    <div id="inquiry-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('inquiry-modal')">&times;</button>
            <div class="modal-title">1:1 문의글 작성</div>
            <textarea id="inquiry-text" class="inquiry-textarea" placeholder="문의할 내용을 자세히 적어 주세요."></textarea>
            <button id="inquiry-submit" onclick="submitInquiry()" class="btn-primary" style="width: 100%;">문의 접수하기</button>
        </div>
    </div>

    <script src="../JS/supabase.js"></script>
    <script src="../JS/settings.js"></script>
    <script src="../JS/chat.js"></script>
</body>
</html>
