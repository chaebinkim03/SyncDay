<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sync Day</title>
    <link rel="stylesheet" href="../CSS/common.css">
    <link rel="stylesheet" href="../CSS/pages.css">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-layout">
    <header id="header"><h1 class="header-logo">SyncDay</h1><button class="header-logout" onclick="logout()">로그아웃</button></header>
    <div id="main-container">
        <nav id="sidebar-left">
            <h3>메뉴</h3>
            <a href="main.html" class="menu-item active">홈</a>
            <a href="schedule.html" class="menu-item">캘린더</a>
            <a href="todo.html" class="menu-item">투두</a>
            <a href="habit.html" class="menu-item">루틴</a>
            <a href="settings.html" class="menu-item">설정</a>
            <div class="sidebar-profile">
                <div id="user-email-display" class="user-email">로딩중...</div>
                <button onclick="logout()" class="logout-btn">로그아웃</button>
            </div>
        </nav>
        <main id="main-content">
            <div class="half-widget-container" style="height: auto; margin-bottom: 20px;">
                <div class="dashboard-widget half-widget" style="margin-bottom: 0;">
                    <h3>달성도</h3>
                    <div class="progress-section" style="margin-top: 15px;">
                        <div class="progress-label"><span>달성률</span><span id="main-progress-text">0%</span></div>
                        <div class="progress-track"><div class="progress-bar" id="main-progress-bar"></div></div>
                    </div>
                    <div class="weekly-record">
                        <div class="weekly-head"><span>최근 7일 완료 기록</span><span id="weekly-total"></span></div>
                        <div id="weekly-bars" class="weekly-bars"></div>
                    </div>
                </div>
                <div class="dashboard-widget half-widget" style="margin-bottom: 0;">
                    <h3>루틴</h3>
                    <ul id="main-routine-list" class="item-list"><li class="empty-msg">불러오는 중...</li></ul>
                </div>
            </div>

            <div class="half-widget-container">
                <div class="dashboard-widget half-widget">
                    <h3>캘린더</h3>
                    <div id="mini-calendar"></div>
                </div>
                <div class="dashboard-widget half-widget">
                    <h3>To-do</h3>
                    <ul id="urgent-todo-list" class="item-list"><li class="empty-msg">입력한 To-do가 없습니다.</li></ul>
                </div>
            </div>
        </main>
    </div>
    <script src="../JS/supabase.js"></script>
    <script src="../JS/routine.js"></script>
    <script src="../JS/main.js"></script>
    <script src="../JS/chat.js"></script>
</body>
</html>
